[project]
name = "pronostico-demanda-ladrillos"
version = "1.0.0"
description = "Aplicación Streamlit para administrar ventas y pronosticar demanda anual de ladrillos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "plotly==6.9.0",
    "psycopg[binary]==3.3.9",
    "statsmodels==0.15.0",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
